name: Setup Projekt

inputs:
  python-version:
    description: "Python-Version für das Projekt"
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Hinweis ausgeben
      shell: bash
      run: echo "Setup abgeschlossen"
