name: CI
on:
  push:
  pull_request: 

env:
 PYTHON_VERSION: "3.12"
 APP_ENV: staging

permissions:
  contents: read
  
jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        
      - name: Python installieren
        uses: actions/setup-python@v5
        with: 
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Konfiguration anzeigen
        run: echo "Python ${{ env.PYTHON_VERSION }} in ${{ env.APP_ENV }}"
          
      - name: Abhängigkeiten installieren
        run: |
           python -m pip install --upgrade pip
           python -m pip install -r requirements.txt

      - name: Lint prüfen
        run: python -m flake8 .

      - name: Tests ausführen
        run: python -m pytest -v

      - name: Lauf-Informationen anzeigen
        run: |
         echo "Repository: ${{ github.repository }}"
         echo "Branch: ${{ github.ref_name }}"
         echo "Event: ${{ github.event_name }}"
         echo "Runner: ${{ runner.os }}"

      - name: Deploy vorbereiten
        if: github.ref == 'refs/heads/main'
        run: echo "Deploy wird vorbereitet"

      - name: Version ermitteln
        id: version
        shell: bash
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Paket bauen
        shell: bash
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/

      - name: Build-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment-Platzhalter
        run: echo "Deployment für ${{ github.ref_name }}"

      - name: Build-Artifact herunterladen
        uses: actions/download-artifact@v4
        with:
         name: app-paket
         path: build/

      - name: Inhalt prüfen
        run: ls -l build/
